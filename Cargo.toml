[package]
authors = ["madiele92@gmail.com"]
edition = "2021"
name = "vod2pod-rss"
version = "1.2.18"

[lib]
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
actix-rt = "=2.12.0"
google-youtube3 = "=7.0.0"
google-apis-common = "=8.0.0"
hyper-util = { version = "=0.1.20", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
actix-web = "=4.15.0"
async-trait = "=0.1.92"
url = { version="=2.5.8", features = ["serde"]}
futures = "=0.3.34"
log = "=0.4.34"
regex = "=1.13.1"
reqwest = { version = "=0.13.4", features = ["json", "form", "query"] }
serde = "=1.0.229"
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "process", "time"]}
uuid = { version= "=1.26.0", features = ["v4", "serde"]}
genawaiter = {version = "=0.99", features = ["futures03"] }
openssl = { version = "*", features = ["vendored"] } #this is here just to make cross-compiling work during github actions
rss = { version = "=2.1.0", features = ["serde"] }
eyre = "=0.6"
simple_logger = "=5.2.0"
redis = { version = "=1.6.0", features = ["tokio-comp"] }
mime = "=0.3.17"
cached = { version = "=2.0.2", features = ["redis_tokio"] }
iso8601-duration = "=0.2.0"
chrono = "=0.4.45"
feed-rs = "=2.4.0"
rustls = { version = "=0.23.43", default-features = false, features = ["ring"] }

[dev-dependencies]
temp-env ={ version = "=0.3.6", features = ["async_closure"] }
env_logger = "*"
test-log = "0.2.11"
ctor = "=1.0.13"
